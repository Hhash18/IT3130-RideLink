spring.application.name=ride-management-service
server.port=${PORT:8083}
server.error.include-message=never
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/ride-management;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false
ridelink.driver-service-url=${DRIVER_SERVICE_URL:http://localhost:8081}
ridelink.fare-service-url=${FARE_SERVICE_URL:http://localhost:8084}
ridelink.jwt-mode=${JWT_MODE:account}
ridelink.jwt-secret=${JWT_SECRET:}
ridelink.jwt-issuer=${JWT_ISSUER:http://localhost:8081}
ridelink.jwt-jwks=${JWT_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}
ridelink.jwt-audience=${JWT_AUDIENCE:ridelink}
springdoc.swagger-ui.path=/swagger-ui.html
