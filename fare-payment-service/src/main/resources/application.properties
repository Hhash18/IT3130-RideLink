spring.application.name=fare-payment-service
server.port=${PORT:8084}
server.error.include-message=never

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ridelink_fare_payment_db?connectionTimeZone=UTC}
spring.datasource.username=${DB_USERNAME:ridelink_fare_payment}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false

# Same raw UTF-8 secret as Account Service; never commit a real value.
# Required in normal mode. Demo uses DEMO_PASSWORD instead.
ridelink.security.jwt-secret=${JWT_SECRET:}
ridelink.ride-service-url=${RIDE_SERVICE_URL:http://localhost:8083}
springdoc.swagger-ui.path=/swagger-ui.html

spring.flyway.locations=classpath:db/migration/{vendor}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
