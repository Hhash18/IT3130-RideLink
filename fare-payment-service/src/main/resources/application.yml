server:
  port: ${PORT:8084}
  error:
    include-message: never
spring:
  application:
    name: fare-payment-service
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/fare-payment;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
ridelink:
  security:
    issuer: ${JWT_ISSUER:http://localhost:8081}
    jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}
    audience: ${JWT_AUDIENCE:ridelink}
  ride-service-url: ${RIDE_SERVICE_URL:http://localhost:8083}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
