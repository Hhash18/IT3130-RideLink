name: All Services MySQL Integration
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: '**/pom.xml'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build, unit test and start services on MySQL
        run: python3 scripts/local.py start
      - name: Prepare local Postman environment
        run: python3 scripts/prepare-postman.py
      - name: Run real service endpoints
        run: >-
          npx --yes --registry=https://registry.npmjs.org newman@6.2.3 run
          postman/RideLink-Full-Flow.postman_collection.json
          -e .local/RideLink-Local.postman_environment.json
          --export-environment .local/RideLink-Local.postman_environment.json
          --bail
      - name: Check SQL records and restart database and services
        run: |
          python3 scripts/verify-persistence.py
          python3 scripts/local.py stop
          docker compose restart mysql
          python3 scripts/local.py start --no-build
      - name: Verify the same records after restart
        run: |
          npx --yes --registry=https://registry.npmjs.org newman@6.2.3 run postman/RideLink-Verify-Saved-Data.postman_collection.json -e .local/RideLink-Local.postman_environment.json --bail
          python3 scripts/verify-persistence.py
      - name: Stop services (keep secrets out of artifacts)
        if: always()
        run: |
          python3 scripts/local.py stop
          docker compose stop
