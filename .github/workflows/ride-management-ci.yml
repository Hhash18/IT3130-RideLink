name: Ride Management CI
on:
  push:
    paths: ['ride-management-service/**', '.github/workflows/ride-management-ci.yml']
  pull_request:
    paths: ['ride-management-service/**', '.github/workflows/ride-management-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: ride-management-service/pom.xml
      - run: mvn -B -ntp -f ride-management-service/pom.xml clean verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ride-management-test-results
          path: ride-management-service/target/surefire-reports/
